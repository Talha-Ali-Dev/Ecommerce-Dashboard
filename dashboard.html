<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopWave – Ecommerce Dashboard</title>
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-bg p-4">

    <div class="grid grid-cols-6 gap-4">
        <aside
            class="bg-surface border border-surface-border py-5 px-3 min-h-screen rounded-md flex flex-col justify-between">

            <div>

                <div class="logo flex justify-start items-center gap-3">
                    <div
                        class="size-8 bg-linear-to-br from-accent to-accent-2 rounded-md text-white flex justify-center items-center font-bold">
                        S
                    </div>
                    <div>
                        <p class="font-bold text-accent text-lg">ShopWave</p>
                        <p class="text-muted text-[11px]">Sell More. Grow Beyond.</p>
                    </div>
                </div>

                <div class="navigations flex flex-col justify-between gap-2 mt-4">

                    <div class="flex flex-col justify-start items-start gap-2">

                        <button
                            class="flex justify-start gap-2 items-center text-muted font-medium w-full px-2.5 py-2.5 hover:bg-accent-soft rounded-md border border-transparent focus:border-surface-border focus:bg-accent-soft hover:text-accent text-sm"
                            data-target="dashboard">
                            <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"></path>
                                </svg>
                            </span>
                            <span>Dashboard</span></button>

                        <button
                            class="flex justify-start gap-2 items-center text-muted font-medium w-full px-2.5 py-2.5 hover:bg-accent-soft rounded-md border border-transparent focus:border-surface-border focus:bg-accent-soft hover:text-accent text-sm"
                            data-target="orders">
                            <span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M5 3h14v18H5zM9 8h6M9 12h6M9 16h3"></path>
                                </svg>
                            </span>
                            <span>Orders</span></button>

                        <button
                            class="flex justify-start gap-2 items-center text-muted font-medium w-full px-2.5 py-2.5 hover:bg-accent-soft rounded-md border border-transparent focus:border-surface-border focus:bg-accent-soft hover:text-accent text-sm"
                            data-target="products">
                            <span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 2l9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"></path>
                                </svg>
                            </span>
                            <span>Products</span></button>

                        <button
                            class="flex justify-start gap-2 items-center text-muted font-medium w-full px-2.5 py-2.5 hover:bg-accent-soft rounded-md border border-transparent focus:border-surface-border focus:bg-accent-soft hover:text-accent text-sm"
                            data-target="customers">
                            <span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M16 20v-2a4 4 0 0 0-8 0v2M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 20v-2a4 4 0 0 0-3-3.8">
                                    </path>
                                </svg>
                            </span>
                            <span>Customers</span></button>

                        <button
                            class="flex justify-start gap-2 items-center text-muted font-medium w-full px-2.5 py-2.5 hover:bg-accent-soft rounded-md border border-transparent focus:border-surface-border focus:bg-accent-soft hover:text-accent text-sm"
                            data-target="analytics">
                            <span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 20V10M10 20V4M16 20v-8M22 20H2"></path>
                                </svg>
                            </span>
                            <span>Analytics</span></button>

                        <button
                            class="flex justify-start gap-2 items-center text-muted font-medium w-full px-2.5 py-2.5 hover:bg-accent-soft rounded-md border border-transparent focus:border-surface-border focus:bg-accent-soft hover:text-accent text-sm"
                            data-target="marketing">
                            <span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 11v3l14 6V5zM17 9a3 3 0 0 1 0 6"></path>
                                </svg>
                            </span>
                            <span>Marketing</span></button>

                        <button
                            class="flex justify-start gap-2 items-center text-muted font-medium w-full px-2.5 py-2.5 hover:bg-accent-soft rounded-md border border-transparent focus:border-surface-border focus:bg-accent-soft hover:text-accent text-sm"
                            data-target="discounts">
                            <span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 12V3h9l9 9-9 9zM7.5 7.5h.01"></path>
                                </svg>
                            </span>
                            <span>Discounts</span></button>

                    </div>

                </div>

            </div>

            <div class="bottom-navigations">

                <div class="flex flex-col justify-start items-start gap-2">

                    <div class="px-4 py-4 bg-linear-to-br from-accent-2 to-accent text-white rounded-md">

                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"></path>
                        </svg>

                        <p class="font-bold my-2 text-sm">Upgrade to Pro</p>
                        <p class=" text-xs">Unlock advanced analytics and more features.</p>

                    </div>

                    <button
                        class="flex justify-start gap-2 items-center text-muted font-medium w-full px-2.5 py-2.5 hover:bg-accent-soft rounded-md border border-transparent focus:border-surface-border focus:bg-accent-soft hover:text-accent text-sm"
                        data-target="settings">
                        <span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12l2-1-2-4-2 1-2-1V5h-4v2l-2 1-2-1-2 4 2 1v2l-2 1 2 4 2-1 2 1v2h4v-2l2-1 2 1 2-4-2-1z">
                                </path>
                            </svg>
                        </span>
                        <span>Settings</span></button>

                    <button
                        class="flex justify-start gap-2 items-center text-muted font-medium w-full px-2.5 py-2.5 hover:bg-accent-soft rounded-md border border-transparent focus:border-surface-border focus:bg-accent-soft hover:text-accent text-sm"
                        data-target="discounts">
                        <span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01">
                                </path>
                            </svg>
                        </span>
                        <span>Help</span></button>

                </div>

            </div>

        </aside>


    </div>

</body>

</html>
